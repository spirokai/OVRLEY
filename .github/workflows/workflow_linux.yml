name: OVRLEY Linux Release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        description: Checked-out release ref
        required: true
        type: string
      release_tag:
        description: Stable Semantic Release tag
        required: true
        type: string
      release_version:
        description: Normalized stable release version
        required: true
        type: string
      release_commit:
        description: Commit SHA the release tag must point at
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout selected release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve and validate release identity
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_VERSION: ${{ inputs.release_version }}
          INPUT_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          stable_tag_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          candidates=()
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ $stable_tag_pattern ]]; then
              candidates+=("$candidate")
            fi
          done < <(git tag --points-at HEAD)

          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
            version="$INPUT_VERSION"
            commit="$INPUT_COMMIT"
            [[ "$tag" =~ $stable_tag_pattern ]] || { echo "Reusable workflow received a non-stable tag: $tag" >&2; exit 1; }
            [[ "$tag" == "$version" ]] || { echo "Reusable workflow tag and version differ." >&2; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$commit" ]] || { echo "Checked-out commit differs from the orchestrator commit." >&2; exit 1; }
            [[ "${#candidates[@]}" == 1 && "${candidates[0]}" == "$tag" ]] || { echo "Reusable workflow tag is not the unique stable tag at HEAD." >&2; exit 1; }
          else
            [[ "${#candidates[@]}" == 1 ]] || { echo "Expected exactly one stable Semantic Release tag at HEAD." >&2; exit 1; }
            tag="${candidates[0]}"
            version="$tag"
            commit="$(git rev-parse HEAD)"
          fi

          echo "commit=$commit"
          echo "tag=$tag"
          node scripts/set-release-version.mjs "$version"
          {
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate shared packaging resources
        run: pnpm prepare:packaging

      - name: Build Linux application binary
        run: pnpm tauri build --no-bundle --verbose
        env:
          VITE_OVRLEY_VERSION: ${{ steps.release.outputs.tag }}

      - name: Package and sign minimal Linux AppImage
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          app_binary="src-tauri/target/release/app"
          app_dir="$RUNNER_TEMP/OVRLEY.AppDir"
          payload_dir="$app_dir/usr/lib/ovrley"
          appimage_name="OVRLEY-linux-$version.AppImage"
          appimage_path="dist-release/$appimage_name"
          appimagetool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"

          [[ -x "$app_binary" ]] || { echo 'Release application binary is missing or not executable.' >&2; exit 1; }
          ldd_output="$(ldd "$app_binary")"
          printf '%s\n' "$ldd_output"
          ! grep -q 'not found' <<< "$ldd_output" || { echo 'Release application binary has unresolved host dependencies.' >&2; exit 1; }
          grep -q 'libwebkit2gtk-4.1.so.0 =>' <<< "$ldd_output" || { echo 'Release application binary is not linked to host WebKitGTK 4.1.' >&2; exit 1; }
          grep -q 'libgtk-3.so.0 =>' <<< "$ldd_output" || { echo 'Release application binary is not linked to host GTK 3.' >&2; exit 1; }
          grep -q 'libgio-2.0.so.0 =>' <<< "$ldd_output" || { echo 'Release application binary is not linked to host GIO.' >&2; exit 1; }
          [[ -z "$(patchelf --print-rpath "$app_binary")" ]] || { echo 'Release application binary must not have an embedded library search path.' >&2; exit 1; }

          rm -rf "$app_dir" dist-release
          mkdir -p "$payload_dir/vendor" "$app_dir/usr/bin" "$app_dir/usr/share/applications" dist-release
          install -m 0755 "$app_binary" "$payload_dir/OVRLEY"
          cp -a vendor/ffmpeg "$payload_dir/vendor/ffmpeg"
          cp -a fonts "$payload_dir/fonts"
          cp -a templates "$payload_dir/templates"
          install -m 0644 THIRD_PARTY_NOTICES.txt "$payload_dir/THIRD_PARTY_NOTICES.txt"
          install -m 0644 INSTALL-linux.txt "$payload_dir/INSTALL.txt"
          install -m 0755 scripts/appimage/AppRun "$app_dir/AppRun"
          install -m 0644 scripts/appimage/com.ovrley.desktop "$app_dir/usr/share/applications/com.ovrley.desktop"
          ln -s ../lib/ovrley/OVRLEY "$app_dir/usr/bin/OVRLEY"

          for size in 32x32 64x64 128x128; do
            install -Dm0644 "src-tauri/icons/$size.png" "$app_dir/usr/share/icons/hicolor/$size/apps/ovrley.png"
          done
          install -Dm0644 src-tauri/icons/128x128@2x.png "$app_dir/usr/share/icons/hicolor/256x256/apps/ovrley.png"
          ln -s usr/share/applications/com.ovrley.desktop "$app_dir/com.ovrley.desktop"
          ln -s usr/share/icons/hicolor/128x128/apps/ovrley.png "$app_dir/ovrley.png"
          ln -s ovrley.png "$app_dir/.DirIcon"

          curl --fail --location --retry 3 \
            --output "$appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$appimagetool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 VERSION="$version" \
            "$appimagetool" --no-appstream "$app_dir" "$appimage_path"
          chmod +x "$appimage_path"
          pnpm tauri signer sign "$appimage_path"

      - name: Validate minimal Linux AppImage
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          appimage_name="OVRLEY-linux-$version.AppImage"
          [[ -s "dist-release/$appimage_name" ]] || { echo 'Linux AppImage is missing or empty.' >&2; exit 1; }
          [[ -s "dist-release/$appimage_name.sig" ]] || { echo 'Linux AppImage signature is missing or empty.' >&2; exit 1; }
          [[ -x "dist-release/$appimage_name" ]] || { echo 'Linux AppImage is not executable.' >&2; exit 1; }

          extract_directory="$RUNNER_TEMP/ovrley-appimage-check"
          rm -rf "$extract_directory" "$RUNNER_TEMP/squashfs-root"
          mkdir -p "$extract_directory"
          appimage_path="$(realpath "dist-release/$appimage_name")"
          (cd "$extract_directory" && "$appimage_path" --appimage-extract >/dev/null)
          appimage_root="$extract_directory/squashfs-root"
          [[ -d "$appimage_root" ]] || { echo 'AppImage extraction failed.' >&2; exit 1; }

          app_binary="$appimage_root/usr/lib/ovrley/OVRLEY"
          ffmpeg_path="$(find "$appimage_root" -type f -path '*/vendor/ffmpeg/bin/ffmpeg' -print -quit)"
          ffprobe_path="$(find "$appimage_root" -type f -path '*/vendor/ffmpeg/bin/ffprobe' -print -quit)"
          [[ -x "$app_binary" ]] || { echo 'Extracted AppImage is missing the OVRLEY executable.' >&2; exit 1; }
          [[ -n "$ffmpeg_path" && -x "$ffmpeg_path" ]] || { echo 'Extracted AppImage is missing executable FFmpeg.' >&2; exit 1; }
          [[ -n "$ffprobe_path" && -x "$ffprobe_path" ]] || { echo 'Extracted AppImage is missing executable FFprobe.' >&2; exit 1; }
          find "$appimage_root" -type d -path '*/fonts' -print -quit | grep -q . || { echo 'Extracted AppImage is missing fonts.' >&2; exit 1; }
          find "$appimage_root" -type d -path '*/templates' -print -quit | grep -q . || { echo 'Extracted AppImage is missing templates.' >&2; exit 1; }
          find "$appimage_root" -type f -name 'THIRD_PARTY_NOTICES.txt' -print -quit | grep -q . || { echo 'Extracted AppImage is missing third-party notices.' >&2; exit 1; }
          find "$appimage_root" -type f -name 'INSTALL.txt' -print -quit | grep -q . || { echo 'Extracted AppImage is missing Linux installation documentation.' >&2; exit 1; }
          [[ -e "$appimage_root/.DirIcon" ]] || { echo 'Extracted AppImage is missing its root icon.' >&2; exit 1; }
          desktop_file="$(find "$appimage_root/usr/share/applications" -maxdepth 1 -type f -name '*.desktop' -print -quit)"
          [[ -n "$desktop_file" ]] || { echo 'Extracted AppImage is missing its desktop entry.' >&2; exit 1; }
          grep -Fxq 'Name=OVRLEY' "$desktop_file" || { echo 'Extracted AppImage desktop entry has the wrong application name.' >&2; exit 1; }
          grep -Fxq 'StartupWMClass=com.ovrley.desktop' "$desktop_file" || { echo 'Extracted AppImage desktop entry has the wrong GTK application ID.' >&2; exit 1; }
          find "$appimage_root/usr/share/icons/hicolor" -type f -name '*.png' -print -quit | grep -q . || { echo 'Extracted AppImage is missing its application icon assets.' >&2; exit 1; }

          forbidden_payload="$(find "$appimage_root" \( -type f -o -type l \) \( \
            -name 'libglib-2.0.so*' -o \
            -name 'libgio-2.0.so*' -o \
            -name 'libgobject-2.0.so*' -o \
            -name 'libgmodule-2.0.so*' -o \
            -name 'libgthread-2.0.so*' -o \
            -name 'libgtk-3.so*' -o \
            -name 'libgdk-3.so*' -o \
            -name 'libwebkit2gtk-4.1.so*' -o \
            -name 'libjavascriptcoregtk-4.1.so*' -o \
            -name 'libgstreamer-1.0.so*' -o \
            -name 'libgst*.so*' -o \
            -name 'WebKitWebProcess' -o \
            -name 'WebKitNetworkProcess' \
          \) -print)"
          [[ -z "$forbidden_payload" ]] || { printf 'AppImage contains forbidden host-stack files:\n%s\n' "$forbidden_payload" >&2; exit 1; }
          ! grep -Eq 'LD_LIBRARY_PATH|GIO_MODULE|GST_PLUGIN|WEBKIT_EXEC_PATH' "$appimage_root/AppRun" || { echo 'AppRun overrides host library or plugin resolution.' >&2; exit 1; }

          "$ffmpeg_path" -version
          "$ffprobe_path" -version >/dev/null

          expected="$(printf '%s\n' "$appimage_name" "$appimage_name.sig" | sort)"
          actual="$(find dist-release -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual" == "$expected" ]] || { echo 'Linux output names are not canonical.' >&2; exit 1; }

      - name: Upload Linux Actions artifact
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: ovrley-linux-artifacts-${{ steps.release.outputs.tag }}
          path: |
            dist-release/OVRLEY-linux-${{ steps.release.outputs.tag }}.AppImage
            dist-release/OVRLEY-linux-${{ steps.release.outputs.tag }}.AppImage.sig
          if-no-files-found: error

      - name: Upload independent public Linux asset
        if: inputs.release_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist-release/OVRLEY-linux-${{ steps.release.outputs.tag }}.AppImage
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

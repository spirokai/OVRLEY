name: Release Flatpak

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    name: WASM bindings
    uses: ./.github/workflows/workflow_wasm.yml
    with:
      ref: ''

  build:
    needs: wasm
    name: Build Flatpak bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(git tag --points-at HEAD --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$TAG" ]; then
            echo "No semantic-release tag points at the selected branch tip." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Allow user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Download WASM bindings
        uses: actions/download-artifact@v7
        with:
          name: ovrley-wasm-bindings
          path: packaging/flatpak/wasm

      - name: Build Flatpak
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          test -f packaging/flatpak/wasm/wasm_bindings.js
          test -f packaging/flatpak/wasm/wasm_bindings.wasm
          sed -i "s/^        OVRLEY_VERSION: .*/        OVRLEY_VERSION: $RELEASE_VERSION/" packaging/flatpak/cc.ovrley.OVRLEY.yml
          grep -q "OVRLEY_VERSION: $RELEASE_VERSION\$" packaging/flatpak/cc.ovrley.OVRLEY.yml
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --repo=repo build packaging/flatpak/cc.ovrley.OVRLEY.yml
          mkdir -p dist-release
          flatpak build-bundle repo "dist-release/OVRLEY-linux-$RELEASE_VERSION.flatpak" cc.ovrley.OVRLEY \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: dist-release/OVRLEY-linux-${{ steps.release_tag.outputs.tag }}.flatpak
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: OVRLEY Windows Release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        description: Checked-out release ref
        required: true
        type: string
      release_tag:
        description: Stable Semantic Release tag
        required: true
        type: string
      release_version:
        description: Normalized stable release version
        required: true
        type: string
      release_commit:
        description: Commit SHA the release tag must point at
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout selected release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve and validate release identity
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_VERSION: ${{ inputs.release_version }}
          INPUT_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          stable_tag_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          candidates=()
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ $stable_tag_pattern ]]; then
              candidates+=("$candidate")
            fi
          done < <(git tag --points-at HEAD)

          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
            version="$INPUT_VERSION"
            commit="$INPUT_COMMIT"
            [[ "$tag" =~ $stable_tag_pattern ]] || { echo "Reusable workflow received a non-stable tag: $tag" >&2; exit 1; }
            [[ "$tag" == "$version" ]] || { echo "Reusable workflow tag and version differ." >&2; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$commit" ]] || { echo "Checked-out commit differs from the orchestrator commit." >&2; exit 1; }
            [[ "${#candidates[@]}" == 1 && "${candidates[0]}" == "$tag" ]] || { echo "Reusable workflow tag is not the unique stable tag at HEAD." >&2; exit 1; }
          else
            [[ "${#candidates[@]}" == 1 ]] || { echo "Expected exactly one stable Semantic Release tag at HEAD." >&2; exit 1; }
            tag="${candidates[0]}"
            version="$tag"
            commit="$(git rev-parse HEAD)"
          fi

          echo "commit=$commit"
          echo "tag=$tag"
          node scripts/set-release-version.mjs "$version"
          {
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate shared packaging resources
        run: pnpm prepare:packaging

      - name: Build signed NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          VITE_OVRLEY_VERSION: ${{ steps.release.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Normalize and validate Windows artifacts
        id: artifacts
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $outputDirectory = Join-Path $PWD 'dist-release'
          $portableDirectory = Join-Path $PWD 'dist-portable'
          Remove-Item -LiteralPath $outputDirectory, $portableDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outputDirectory | Out-Null

          $setupCandidates = @(Get-ChildItem 'src-tauri\target' -Filter '*-setup.exe' -File -Recurse | Where-Object { $_.FullName -match '\\bundle\\nsis\\' })
          if ($setupCandidates.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($setupCandidates.Count)." }
          $setupSource = $setupCandidates[0]
          $signatureSource = Get-Item -LiteralPath "$($setupSource.FullName).sig"
          if ($setupSource.Length -le 0 -or $signatureSource.Length -le 0) { throw 'NSIS setup or signature is empty.' }

          $setupName = "OVRLEY-win-$version.exe"
          $portableName = "OVRLEY-win-$version-portable.zip"
          $setupPath = Join-Path $outputDirectory $setupName
          $signaturePath = Join-Path $outputDirectory "$setupName.sig"
          Copy-Item -LiteralPath $setupSource.FullName -Destination $setupPath
          Copy-Item -LiteralPath $signatureSource.FullName -Destination $signaturePath

          $nativeBinary = Get-Item -LiteralPath 'src-tauri\target\release\app.exe'
          if ($nativeBinary.Length -le 0) { throw 'The compiled application executable is missing or empty.' }
          $nativeVersion = $nativeBinary.VersionInfo.ProductVersion
          if ($nativeVersion -notmatch "^$([regex]::Escape($version))(\.0)?$") { throw "Native Windows version $nativeVersion does not match $version." }

          node scripts/package-portable.mjs --version $version --archive-name $portableName
          $portablePath = Join-Path $portableDirectory $portableName
          if (-not (Test-Path -LiteralPath $portablePath)) { throw 'Portable ZIP was not produced.' }

          $portableHash = (Get-FileHash -LiteralPath (Join-Path $portableDirectory 'OVRLEY\OVRLEY.exe')).Hash
          $nativeHash = (Get-FileHash -LiteralPath $nativeBinary.FullName).Hash
          if ($portableHash -ne $nativeHash) { throw 'Portable executable does not match the compiled installer executable.' }

          $extractDirectory = Join-Path $env:RUNNER_TEMP 'ovrley-portable-check'
          Remove-Item -LiteralPath $extractDirectory -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $portablePath -DestinationPath $extractDirectory
          $portableRoot = Join-Path $extractDirectory 'OVRLEY'
          foreach ($requiredPath in @('OVRLEY.exe', '.ovrley-portable', 'fonts', 'templates', 'vendor\ffmpeg\bin\ffmpeg.exe', 'vendor\ffmpeg\bin\ffprobe.exe', 'THIRD_PARTY_NOTICES.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $portableRoot $requiredPath))) { throw "Portable ZIP is missing $requiredPath." }
          }

          $markersInInstallerInputs = @(Get-ChildItem 'src-tauri\target\release' -Filter '.ovrley-portable' -File -Recurse -Force -ErrorAction SilentlyContinue)
          if ($markersInInstallerInputs.Count -ne 0) { throw 'Portable marker leaked into NSIS build inputs.' }

          $expected = @($setupName, "$setupName.sig", $portableName)
           $actual = @(Get-ChildItem -LiteralPath $outputDirectory, $portableDirectory -File | ForEach-Object Name)
          $expectedNames = ($expected | Sort-Object) -join "`n"
          $actualNames = ($actual | Sort-Object) -join "`n"
          if ($actualNames -cne $expectedNames) { throw 'Windows output names are not canonical.' }
          "setup=$setupPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portable=$portablePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows Actions artifact
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: ovrley-windows-artifacts-${{ steps.release.outputs.tag }}
          path: |
            dist-release/OVRLEY-win-${{ steps.release.outputs.tag }}.exe
            dist-release/OVRLEY-win-${{ steps.release.outputs.tag }}.exe.sig
            dist-portable/OVRLEY-win-${{ steps.release.outputs.tag }}-portable.zip
          if-no-files-found: error

      - name: Upload independent public Windows assets
        if: inputs.release_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            dist-release/OVRLEY-win-${{ steps.release.outputs.tag }}.exe
            dist-portable/OVRLEY-win-${{ steps.release.outputs.tag }}-portable.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

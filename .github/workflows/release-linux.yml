name: Release Debian Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debian package
    runs-on: ubuntu-latest
    env:
      # Cargo's built-in git client is slow at cloning the rust-skia submodules.
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(git tag --points-at HEAD --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' | head -n 1 || true)"
          if [ -z "$TAG" ]; then
            echo "No semantic-release tag points at the selected branch tip." >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true
          sudo apt-get clean
          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            build-essential \
            curl \
            dpkg-dev \
            fakeroot \
            file \
            libasound2-dev \
            libdrm2 \
            libfontconfig1-dev \
            libfreetype-dev \
            libfribidi0 \
            libgbm1 \
            libgl1 \
            libharfbuzz0b \
            liblz4-1 \
            libpulse0 \
            libwayland-client0 \
            libx11-xcb1 \
            pkg-config \
            unzip \
            zip

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: deb
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cargo-packager
        run: pnpm install:packager

      - name: Set package version
        run: node scripts/release/set-version.mjs "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.release_tag.outputs.version }}

      - name: Verify bundled FFmpeg resource tree
        shell: bash
        run: |
          set -euo pipefail
          test -x vendor/ffmpeg/bin/ffmpeg
          test -x vendor/ffmpeg/bin/ffprobe
          vendor/ffmpeg/bin/ffmpeg -version
          vendor/ffmpeg/bin/ffprobe -version

      - name: Build Debian package
        run: pnpm build --bundles deb

      - name: Add no-update marker to Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find target/packaging/out -maxdepth 1 -name '*.deb' -print -quit)"
          [[ -n "$deb" ]] || { echo 'No .deb package was produced.' >&2; exit 1; }

          package_root="$RUNNER_TEMP/ovrley-deb-root"
          rm -rf "$package_root"
          dpkg-deb --raw-extract "$deb" "$package_root"
          mapfile -t executables < <(find "$package_root/usr/bin" -maxdepth 1 -type f -perm /111 -print)
          [[ "${#executables[@]}" == 1 ]] || { echo "Expected exactly one Debian application executable, found ${#executables[@]}." >&2; exit 1; }
          touch "$(dirname "${executables[0]}")/.ovrley-portable"
          # cargo-packager writes no Recommends.
          recommends='intel-media-va-driver | intel-media-va-driver-non-free, libva-drm2, mesa-va-drivers | mesa-libgallium, mesa-vulkan-drivers'
          sed -i "/^Depends: /a Recommends: $recommends" "$package_root/DEBIAN/control"
          fakeroot dpkg-deb --build "$package_root" "$deb"

      - name: Verify Debian package contents
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find target/packaging/out -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$DEB" ]; then
            echo "No .deb package was produced." >&2
            exit 1
          fi
          dpkg-deb -c "$DEB" | grep -E '/vendor/ffmpeg/bin/ffmpeg$'
          dpkg-deb -c "$DEB" | grep -E '/vendor/ffmpeg/bin/ffprobe$'
          dpkg-deb -c "$DEB" | grep -E '/usr/bin/\.ovrley-portable$'
          dpkg-deb -c "$DEB" | grep -E '/usr/bin/OVRLEY$'
          dpkg-deb -c "$DEB" | grep -E '/usr/lib/OVRLEY/lib/libmdk\.so\.0$'
          dpkg-deb -c "$DEB" | grep -E '/usr/share/applications/com\.ovrley\.desktop\.desktop$'

      - name: Create Debian release archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p dist-release
          deb="$(find target/packaging/out -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$deb" ]; then
            echo "No .deb package was produced." >&2
            exit 1
          fi
          archive_root="$RUNNER_TEMP/ovrley-deb-archive"
          archive_name="OVRLEY-linux-$version-deb.zip"
          deb_name="OVRLEY-linux-$version.deb"
          rm -rf "$archive_root"
          mkdir -p "$archive_root"
          install -m 0644 "$deb" "$archive_root/$deb_name"
          install -m 0644 target/packaging/THIRD_PARTY_NOTICES.txt "$archive_root/THIRD_PARTY_NOTICES.txt"
          install -m 0644 packaging/install/INSTALL-debian.txt "$archive_root/INSTALL.txt"
          (cd "$archive_root" && zip -q "$GITHUB_WORKSPACE/dist-release/$archive_name" "$deb_name" THIRD_PARTY_NOTICES.txt INSTALL.txt)

          expected="$(printf '%s\n' "$deb_name" THIRD_PARTY_NOTICES.txt INSTALL.txt | sort)"
          actual="$(unzip -Z1 "dist-release/$archive_name" | sort)"
          [[ "$actual" == "$expected" ]] || { echo 'Debian archive contents are not canonical.' >&2; exit 1; }

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: dist-release/OVRLEY-linux-${{ steps.release_tag.outputs.version }}-deb.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
# The app's desktop services: project files, file operations, map styles and tiles, runtime paths,
# distribution detection, raster resources, widget previews, video thumbnails and timeline
# filmstrips.
name = "ovrley_services"
version.workspace = true
edition = "2021"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
base64 = "0.22"
# Timeline filmstrip sprite sheets; the same 0.25 line as ovrley_core.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
dirs = "6"
ovrley_core = { path = "../ovrley_core" }
ovrley_map = { path = "../ovrley_map", features = ["gpu", "validate"] }
ovrley_widgets = { path = "../ovrley_widgets" }
uuid = { version = "1", features = ["v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
http = "1.4"
http-cache-semantics = "=2.1.0"

[dev-dependencies]
# The fake upstream of the tile cache tests.
tiny_http = "0.12"

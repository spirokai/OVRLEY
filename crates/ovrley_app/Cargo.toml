[package]
# UI-independent application logic: ported helpers and hooks, tested without a window.
name = "ovrley_app"
version.workspace = true
edition = "2021"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[features]
# JSON schemas for the MCP tools' arguments; enabled by ovrley_mcp only.
schema = ["dep:schemars", "ovrley_core/schema"]

# The benchmarks build their cases from the editor's logic, so their binaries belong to this crate.
[[bin]]
name = "benchmark_widgets"
path = "../../benchmarks/widgets/native.rs"
test = false
bench = false

[[bin]]
name = "benchmark_interactions"
path = "../../benchmarks/widget-interactions/native.rs"
test = false
bench = false

[dependencies]
# The .po reader; Slint's compiler uses the same one.
rspolib = "0.1.2"
ovrley_core = { path = "../ovrley_core" }
ovrley_widgets = { path = "../ovrley_widgets" }
ovrley_map = { path = "../ovrley_map" }
ovrley_services = { path = "../ovrley_services" }
schemars = { version = "1", optional = true }
log = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
icu = "2"
sys-locale = "0.3"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }

[package]
name = "ovrley_widgets"
version.workspace = true
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[build-dependencies]
serde_json = "1"
# Unused: it steers dependency resolution. bindgen 0.73.2 (skia-bindings' build dependency)
# accepts syn 2 or 3 and prettyplease 0.2 or 0.3 but only compiles with a matching pair. syn 3 is
# in the graph and prost-build pins prettyplease 0.2, so without this Cargo pairs bindgen with
# prettyplease 0.2 and syn 3, and the build fails.
prettyplease = "0.3"

[features]
# JSON schemas for the document types MCP tools take; enabled by ovrley_mcp only.
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
# The compiled catalog keeps the manifests' key order, which key lists follow.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
unicode-segmentation = "=1.12.0"
image = { version = "0.25", default-features = false }
ovrley_map = { path = "../ovrley_map" }
# `no-compile`: only rust-skia's prebuilt binary, never a source build.
skia-safe = { version = "=0.157.0", features = ["binary-cache", "no-compile"] }

[package]
# OVRLEY's Slint UI: the markup in ui/ and the Rust glue that binds its logic globals to
# ovrley_app, where the UI-free logic lives.
name = "ovrley_ui"
version.workspace = true
edition = "2021"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[features]
# Exports the component showcase and the test harness windows.
dev-windows = []
# Dev only (`pnpm dev:native:live`, with SLINT_LIVE_PREVIEW=1): saving a .slint file reloads the
# UI inside the running app. Never in release builds.
live-preview = ["slint/live-preview"]

[[bin]]
# The packages rename it (scripts/package.mjs).
name = "ovrley"
path = "src/main.rs"

[dependencies]
ovrley_app = { path = "../ovrley_app" }
ovrley_services = { path = "../ovrley_services" }
ovrley_widgets = { path = "../ovrley_widgets" }
ovrley_core = { path = "../ovrley_core" }
ovrley_mcp = { path = "../ovrley_mcp" }
ovrley_playback = { path = "../ovrley_playback" }
arboard = { version = "3.7", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
serde_json = "1.0"
pollster = "0.4"
rfd = "0.16"
slint = { version = "=1.19.0", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-skia",
  "accessibility",
  "unstable-wgpu-30",
  "unstable-winit-030",
  "raw-window-handle-06",
] }

# Not used directly. Slint's Skia renderer depends on it; `no-compile` makes a missing
# prebuilt binary fail the build instead of compiling Skia, also when this crate builds alone.
skia-safe = { version = "=0.157.0", features = ["binary-cache", "no-compile"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSObject",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSButton",
  "NSControl",
] }

[target.'cfg(windows)'.dependencies]
# The Windows build, for the window's edge, and the D3D12 of `examples/gpu_probe.rs`. wgpu-hal's
# version.
windows = { version = "0.62", default-features = false, features = [
  "std",
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

# The Wayland drop listener (winit reports no drops on Wayland).
[target.'cfg(target_os = "linux")'.dependencies]
# The AppImage's menu entry goes into the user's data folder (`platform/appimage_integration.rs`).
dirs = "6"
# The device extension video playback's Vulkan–OpenGL bridge needs (`platform/gpu.rs`). wgpu-hal's
# version.
ash = "0.38"
libc = "0.2"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }

[build-dependencies]
slint-build = "=1.19.0"

# The icon, version information and manifest of OVRLEY's Windows executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"
iconify = "=0.3.1"
regex = "1"
rspolib = "0.1.2"
serde_json = "1.0"

[[example]]
name = "showcase"
required-features = ["dev-windows"]

[[test]]
name = "blur_input"
required-features = ["dev-windows"]

[[test]]
name = "gradient_picker"
required-features = ["dev-windows"]

[[test]]
name = "dialog"
required-features = ["dev-windows"]

[[test]]
name = "app_window"
required-features = ["dev-windows"]

[[test]]
name = "press_away"
required-features = ["dev-windows"]

[[test]]
name = "shell"
required-features = ["dev-windows"]

[[test]]
name = "review_regressions"
required-features = ["dev-windows"]

# cargo-packager's configuration. Paths are relative to this crate. scripts/package.mjs adds what
# differs per OS: the binary's name, the formats, the player's libraries and the install guide.
[package.metadata.packager]
productName = "OVRLEY"
identifier = "com.ovrley.desktop"
# The Tauri installs' publisher, under which a custom install folder is found again.
publisher = "ovrley"
authors = ["spirokai"]
description = "Turn telemetry into customizable video overlays"
icons = [
  "../../assets/icons/32x32.png",
  "../../assets/icons/64x64.png",
  "../../assets/icons/128x128.png",
  "../../assets/icons/128x128@2x.png",
  "../../assets/icons/icon.icns",
  "../../assets/icons/icon.ico",
  "../../assets/icons/icon.png",
]
resources = [
  { src = "../../fonts", target = "fonts" },
  { src = "../../templates", target = "templates" },
  { src = "../../assets/map-styles", target = "map-styles" },
  { src = "../../vendor/ffmpeg", target = "vendor/ffmpeg" },
  { src = "../../target/packaging/THIRD_PARTY_NOTICES.txt", target = "THIRD_PARTY_NOTICES.txt" },
]

[package.metadata.packager.nsis]
installMode = "currentUser"
# Two rules of Tauri's installer, for updating its installs: the Start menu shortcut lies directly
# in Programs ("." is that folder), and an update (/UPDATE) leaves the desktop shortcut as it is.
preinstallSection = '''
!define /redef MUI_STARTMENUPAGE_Application_DEFAULTFOLDER "."
Section PreInstall
  StrCpy $R9 $AppStartMenuFolder 1
  StrCmp $R9 ">" +2 0
    StrCpy $AppStartMenuFolder "."
  ClearErrors
  ${GetOptions} $CMDLINE "/UPDATE" $R9
  IfErrors +2 0
    StrCpy $CMDLINE "$CMDLINE /NS"
  ClearErrors
SectionEnd
'''

[package.metadata.packager.macos]
signingIdentity = "-"
# The executable's, Skia's and MDK's minimum.
minimumSystemVersion = "11.0"
entitlements = "../../packaging/macos/OVRLEY.entitlements"

[package.metadata.packager.linux]
# scripts/package.mjs installs an entry named after the window's app id, which Wayland matches.
generateDesktopEntry = false

[package.metadata.packager.deb]
packageName = "ovrley"
# What OVRLEY, Skia, MDK and MDK's FFmpeg link or must open at start. Codecs are bundled; drivers are
# only recommended (release-linux.yml writes the Recommends, which cargo-packager cannot).
depends = [
  "libasound2 | libasound2t64",
  "libc6",
  "libdrm2",
  "libegl1",
  "libfontconfig1",
  "libfreetype6",
  "libfribidi0",
  "libgbm1",
  "libgcc-s1",
  "libgl1",
  "libharfbuzz0b",
  "liblz4-1",
  "liblzma5",
  "libpulse0",
  "libstdc++6",
  "libvulkan1",
  "libwayland-client0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcursor1",
  "libxi6",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "xdg-desktop-portal | zenity",
  "zlib1g",
]

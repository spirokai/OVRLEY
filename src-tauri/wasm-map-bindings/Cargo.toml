[package]
# The map preview: `ovrley_map::gpu` on WebGL2, in its own WASM module. It loads only when a project
# has a map, and a crash in it can't end the widgets in `wasm-bindings`.
name = "wasm-map-bindings"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "wasm_map_bindings"
crate-type = ["cdylib"]

# Keep the browser toolchain isolated, like wasm-bindings.
[workspace]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[dependencies]
console_error_panic_hook = "0.1"
ovrley_map = { path = "../ovrley_map", features = ["gpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[package]
name = "ovrley_widgets"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[build-dependencies]
serde_json = "1"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
# The compiled catalog keeps the manifests' key order, as JavaScript does.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
unicode-segmentation = "=1.12.0"
image = { version = "0.25", default-features = false }
ovrley_map = { path = "../ovrley_map" }
skia-safe = { version = "=0.153.3", features = ["binary-cache", "no-compile"] }

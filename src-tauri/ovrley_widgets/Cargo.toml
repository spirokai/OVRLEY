[package]
name = "ovrley_widgets"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[build-dependencies]
serde_json = "1"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "=1.12.0"
image = { version = "=0.25.5", default-features = false }
skia-safe = { git = "https://github.com/rust-skia/rust-skia", rev = "b7f043e0b1e2a850e702245de811f01df1f6b0ff", version = "=0.153.3", features = ["binary-cache"] }

[package]
# UI-independent application logic: ported helpers and hooks, tested without a window.
name = "ovrley_app"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[features]
# JSON schemas for the MCP tools' arguments; enabled by ovrley_mcp only.
schema = ["dep:schemars"]

[dependencies]
ovrley_core = { path = "../ovrley_core" }
ovrley_widgets = { path = "../ovrley_widgets" }
ovrley_services = { path = "../ovrley_services" }
schemars = { version = "1", optional = true }
log = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
icu = "2"
sys-locale = "0.3"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }

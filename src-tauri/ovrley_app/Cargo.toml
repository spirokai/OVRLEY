[package]
# UI-independent application logic: ported helpers and hooks, tested without a window.
name = "ovrley_app"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[features]
# JSON schemas for the MCP tools' arguments; enabled by ovrley_mcp only.
schema = ["dep:schemars"]

[dependencies]
ovrley_core = { path = "../ovrley_core" }
schemars = { version = "1", optional = true }
log = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

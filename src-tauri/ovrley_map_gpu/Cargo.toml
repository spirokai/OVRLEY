[package]
# Native GPU map renderer: vector tiles and 3D buildings drawn per frame with wgpu.
# The rendering method is ported from maplibre-rs, see LICENSE-MIT beside this file.
name = "ovrley_map_gpu"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
cgmath = "0.18"
geozero = { version = "0.15", default-features = false, features = ["with-mvt"] }
log = "0.4"
lyon = "1"
maplibre-expr = { version = "0.5", default-features = false }
ovrley_map = { path = "../ovrley_map" }
pollster = "0.4"
serde_json = "1"
wgpu = "30"

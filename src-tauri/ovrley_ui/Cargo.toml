[package]
# OVRLEY's Slint UI: the markup in ui/ and the Rust glue that binds its logic globals to
# ovrley_app, where the UI-free logic lives.
name = "ovrley_ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[features]
# Exports the component showcase and the test harness windows.
dev-windows = []
# Dev only (`pnpm dev:native:live`, with SLINT_LIVE_PREVIEW=1): saving a .slint file reloads the
# UI inside the running app. Never in release builds.
live-preview = ["slint/live-preview"]
# Phase 6B spike (branch spike/mdk-macos, never merged): video playback in the canvas. Runs only
# with OVRLEY_PLAYBACK set; needs MDK_SDK at build time.
video-playback = ["dep:ovrley_playback"]

[[bin]]
# Packaging renames it in Phase 9.
name = "ovrley"
path = "src/main.rs"

[dependencies]
ovrley_app = { path = "../ovrley_app" }
ovrley_services = { path = "../ovrley_services" }
ovrley_widgets = { path = "../ovrley_widgets" }
ovrley_core = { path = "../ovrley_core" }
ovrley_mcp = { path = "../ovrley_mcp" }
arboard = { version = "3.7", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
serde_json = "1.0"
pollster = "0.4"
rfd = "0.16"
slint = { version = "=1.19.0", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-skia",
  "accessibility",
  "unstable-wgpu-30",
  "unstable-winit-030",
  "raw-window-handle-06",
] }

# Not used directly. Slint's Skia renderer depends on it; `no-compile` makes a missing
# prebuilt binary fail the build instead of compiling Skia, also when this crate builds alone.
skia-safe = { version = "=0.157.0", features = ["binary-cache", "no-compile"] }

[target.'cfg(target_os = "macos")'.dependencies]
ovrley_playback = { path = "../ovrley_playback", optional = true }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSObject",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSButton",
  "NSControl",
] }

# The Wayland drop listener (winit reports no drops on Wayland).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }

[build-dependencies]
slint-build = "=1.19.0"
serde_json = "1.0"

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"
iconify = "=0.3.1"
regex = "1"
serde_json = "1.0"

[[example]]
name = "showcase"
required-features = ["dev-windows"]

[[test]]
name = "blur_input"
required-features = ["dev-windows"]

[[test]]
name = "gradient_picker"
required-features = ["dev-windows"]

[[test]]
name = "dialog"
required-features = ["dev-windows"]

[[test]]
name = "app_window"
required-features = ["dev-windows"]

[[test]]
name = "press_away"
required-features = ["dev-windows"]

[[test]]
name = "shell"
required-features = ["dev-windows"]

[[test]]
name = "review_regressions"
required-features = ["dev-windows"]

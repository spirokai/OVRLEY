[package]
# OVRLEY's Slint UI: the markup in ui/ and the Rust glue that binds its logic globals to
# ovrley_app, where the UI-free logic lives.
name = "ovrley_ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[features]
# Exports the component showcase and the test harness windows.
dev-windows = []

[dependencies]
ovrley_app = { path = "../ovrley_app" }
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-skia",
  "accessibility",
  "unstable-wgpu-30",
] }

# Not used directly. Slint's Skia renderer depends on it; `no-compile` makes a missing
# prebuilt binary fail the build instead of compiling Skia, also when this crate builds alone.
skia-safe = { version = "=0.153.3", features = ["binary-cache", "no-compile"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
iconify = "=0.3.1"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
serde_json = "1.0"

[[example]]
name = "showcase"
required-features = ["dev-windows"]

[[test]]
name = "blur_input"
required-features = ["dev-windows"]

[[test]]
name = "gradient_picker"
required-features = ["dev-windows"]

[[test]]
name = "dialog"
required-features = ["dev-windows"]

[[test]]
name = "review_regressions"
required-features = ["dev-windows"]

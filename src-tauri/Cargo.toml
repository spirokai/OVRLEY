[workspace]
members = [".", "ovrley_core", "ovrley_map", "ovrley_widgets", "ovrley_services", "ovrley_ui", "ovrley_app", "ovrley_mcp"]
# A patched dependency (see `[patch.crates-io]`), not a member.
exclude = ["vendor/i-slint-backend-winit"]

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.98"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "=2.2.0"
tauri-plugin-updater = "=2.9.0"
base64 = "0.22"
open = "5"
ovrley_core = { path = "ovrley_core" }
ovrley_map = { path = "ovrley_map", features = ["gpu", "validate"] }
ovrley_widgets = { path = "ovrley_widgets" }
ovrley_services = { path = "ovrley_services" }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
http = "1.4"
http-cache-semantics = "=2.1.0"

[dev-dependencies]
ovrley_services = { path = "ovrley_services", features = ["test-support"] }
tauri = { version = "2.12.5", features = ["protocol-asset", "test"] }

# The main window turns off a WebKitGTK feature through an API newer than the bindings, looked up at runtime.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
libc = "0.2"

# DXGI tells whether a hardware GPU exists before WebView2 starts.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

# Full DWARF for opt-level-3 workspace crates is ~140 MB of every ~170 MB test
# binary, and ovrley_core links ~60 of them. Line tables keep backtrace line numbers.
[profile.dev]
debug = "line-tables-only"

# Per-pixel overlay conversion runs in ovrley_core; unoptimized it makes dev exports unusably slow.
[profile.dev.package.ovrley_core]
opt-level = 3

# Widget sampling, layout and pixel conversion run per frame in export, like ovrley_core.
[profile.dev.package.ovrley_widgets]
opt-level = 3

# wgpu-core's debug lock tracing keeps a thread-local; the native app's shared device is dropped
# from Slint's own thread-local at exit, after that one is gone, and the process aborts on quit.
[profile.dev.package.wgpu-core]
debug-assertions = false

# Dependency debug symbols dominate target/debug (~14 GB) and are not needed to debug this app.
# Dependencies are optimised so Skia, wgpu and Slint stay fast while our crates rebuild quickly.
[profile.dev.package."*"]
debug = false
opt-level = 2

# Slint's winit backend 1.18.1 with one fix in `frame_throttle.rs` (marked "OVRLEY patch"): on
# Windows and X11 its timer requested a redraw on every tick before checking that one was
# pending, so each change cost a second full-window repaint a frame later (30 fps playback drew
# 45 times a second). Slint's master already has the fix; drop this with the next Slint release.
# Slint is pinned to =1.18.1 in ovrley_ui.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }

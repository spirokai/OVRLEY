[workspace]
members = [".", "ovrley_core", "ovrley_map", "ovrley_map_gpu", "ovrley_widgets"]

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.95"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# GPU map gate only (src/bin/map_gpu_gate.rs).
map-gpu-gate = ["dep:ovrley_map_gpu", "dep:skia-safe"]

[[bin]]
name = "map_gpu_gate"
path = "src/bin/map_gpu_gate.rs"
required-features = ["map-gpu-gate"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# TEMPORARY: devtools in release builds for WebKit debugging. Revert before release.
tauri = { version = "2.9.5", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "=2.2.0"
tauri-plugin-updater = "=2.9.0"
base64 = "0.22"
open = "5"
ovrley_core = { path = "ovrley_core" }
ovrley_map = { path = "ovrley_map", features = ["raster"] }
ovrley_map_gpu = { path = "ovrley_map_gpu", optional = true }
ovrley_widgets = { path = "ovrley_widgets" }
skia-safe = { git = "https://github.com/rust-skia/rust-skia", rev = "b7f043e0b1e2a850e702245de811f01df1f6b0ff", version = "=0.153.3", features = [
  "binary-cache",
], optional = true }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
http = "1.4"
http-cache-semantics = "=2.1.0"
# Phase 1 map gate only (src/bin/map_tile_gate.rs). Remove with that binary.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

# Per-pixel overlay conversion runs in ovrley_core; unoptimized it makes dev exports unusably slow.
[profile.dev.package.ovrley_core]
opt-level = 3

# Widget sampling, layout and pixel conversion run per frame in export, like ovrley_core.
[profile.dev.package.ovrley_widgets]
opt-level = 3

# Dependency debug symbols dominate target/debug (~14 GB) and are not needed to debug this app.
[profile.dev.package."*"]
debug = false

[workspace]
members = ["ovrley_core", "ovrley_map", "ovrley_widgets", "ovrley_services", "ovrley_ui", "ovrley_app", "ovrley_mcp", "ovrley_playback"]
resolver = "2"

# Full DWARF for opt-level-3 workspace crates is ~140 MB of every ~170 MB test
# binary, and ovrley_core links ~60 of them. Line tables keep backtrace line numbers.
[profile.dev]
debug = "line-tables-only"

# Per-pixel overlay conversion runs in ovrley_core; unoptimized it makes dev exports unusably slow.
[profile.dev.package.ovrley_core]
opt-level = 3

# Widget sampling, layout and pixel conversion run per frame in export, like ovrley_core.
[profile.dev.package.ovrley_widgets]
opt-level = 3

# wgpu-core's debug lock tracing keeps a thread-local; the native app's shared device is dropped
# from Slint's own thread-local at exit, after that one is gone, and the process aborts on quit.
[profile.dev.package.wgpu-core]
debug-assertions = false

# Dependency debug symbols dominate target/debug (~14 GB) and are not needed to debug this app.
# Dependencies are optimised so Skia, wgpu and Slint stay fast while our crates rebuild quickly.
[profile.dev.package."*"]
debug = false
opt-level = 2

# Published crates with a local change; see patches/README.md.
[patch.crates-io]
i-slint-renderer-skia = { path = "patches/i-slint-renderer-skia" }

[workspace]
members = [".", "ovrley_core", "ovrley_widgets"]

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.95"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# TEMPORARY: devtools in release builds for WebKit debugging. Revert before release.
tauri = { version = "2.9.5", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "=2.2.0"
tauri-plugin-updater = "=2.9.0"
base64 = "0.22"
open = "5"
ovrley_core = { path = "ovrley_core" }
ovrley_widgets = { path = "ovrley_widgets" }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
http = "1.4"
http-cache-semantics = "=2.1.0"

# Per-pixel overlay conversion runs in ovrley_core; unoptimized it makes dev exports unusably slow.
[profile.dev.package.ovrley_core]
opt-level = 3
